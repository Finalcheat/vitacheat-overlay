name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build as a draft release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag, source version, and release notes
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py check --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}

  draft:
    name: Prepare GitHub Release draft
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vitacheat-overlay-package
          path: dist
      - name: Verify exact assets and prepare release notes
        run: python3 scripts/release.py prepare --tag "$RELEASE_TAG" --assets dist --notes-output release-notes.md
      - name: Refuse to overwrite an existing release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists. Review it instead of overwriting its assets.' >&2
            exit 1
          fi
      - name: Create draft with installation ZIP and SHA-256
        run: |
          prerelease_args=()
          if [ "$RELEASE_PRERELEASE" = true ]; then
            prerelease_args+=(--prerelease)
          fi
          archive="dist/VitaCheatOverlay-$RELEASE_VERSION.zip"
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
            --title "VitaCheat Overlay ${RELEASE_TAG#v}" --notes-file release-notes.md \
            --draft "${prerelease_args[@]}"
